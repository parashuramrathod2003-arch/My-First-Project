{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card card-custom p-4 shadow">
            <div class="text-center mb-4">
                <i class="fas fa-seedling text-success fs-1 mb-2"></i>
                <h3 class="fw-bold">Farmer Login</h3>
                <p class="text-muted">Enter credentials to access your advisory dashboard</p>
            </div>
            
            <form action="{{ url_for('public.login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="fas fa-user text-success"></i></span>
                        <input type="text" class="form-control py-2" id="username" name="username" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="fas fa-lock text-success"></i></span>
                        <input type="password" class="form-control py-2" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3"><i class="fas fa-sign-in-alt me-2"></i>Sign In</button>
            </form>
            
            <div class="text-center">
                <p class="mb-1 text-muted">Don't have an account? <a href="{{ url_for('public.register') }}" class="text-success fw-bold text-decoration-none">Register here</a></p>
                <p class="mb-0"><a href="{{ url_for('public.admin_login') }}" class="text-secondary small text-decoration-none">System Admin login &rarr;</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
