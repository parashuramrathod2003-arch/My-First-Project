{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card card-custom p-4 shadow border-top border-4 border-danger">
            <div class="text-center mb-4">
                <i class="fas fa-user-shield text-danger fs-1 mb-2"></i>
                <h3 class="fw-bold">Admin Portal</h3>
                <p class="text-muted">Enter administrative credentials</p>
            </div>
            
            <form action="{{ url_for('public.admin_login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="fas fa-user-cog text-danger"></i></span>
                        <input type="text" class="form-control py-2" id="username" name="username" placeholder="Enter admin username" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="fas fa-lock text-danger"></i></span>
                        <input type="password" class="form-control py-2" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-danger w-100 py-2 mb-3"><i class="fas fa-sign-in-alt me-2"></i>Admin Sign In</button>
            </form>
            
            <div class="text-center">
                <p class="mb-0"><a href="{{ url_for('public.login') }}" class="text-success text-decoration-none">&larr; Return to Farmer Login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
