{% extends 'farmer_base.html' %}
{% block farmer_content %}
<div class="row">
    <div class="col-lg-6 mb-4">
        <!-- Preference Settings -->
        <div class="card card-custom p-4 border-0 shadow-sm h-100">
            <h4 class="fw-bold text-success mb-3"><i class="fas fa-sliders-h me-2"></i>Preferences</h4>
            <p class="text-muted">Configure your platform experience preferences.</p>
            
            <form action="{{ url_for('farmer.settings') }}" method="POST" class="mt-2">
                <div class="mb-4">
                    <label for="languageSetting" class="form-label fw-semibold">Default System Language</label>
                    <select class="form-select py-2" id="languageSetting" name="language">
                        <option value="en" {% if session.get('lang') == 'en' %}selected{% endif %}>English (Default)</option>
                        <option value="kn" {% if session.get('lang') == 'kn' %}selected{% endif %}>ಕನ್ನಡ (Kannada)</option>
                    </select>
                    <small class="text-muted">This sets the default translation parameter when logging in.</small>
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2"><i class="fas fa-check me-2"></i>Save Preferences</button>
            </form>
        </div>
    </div>
    
    <div class="col-lg-6 mb-4">
        <!-- Change Password -->
        <div class="card card-custom p-4 border-0 shadow-sm h-100">
            <h4 class="fw-bold text-success mb-3"><i class="fas fa-key me-2"></i>Change Password</h4>
            <p class="text-muted">Update your login security credentials regularly.</p>
            
            <form action="{{ url_for('farmer.settings') }}" method="POST">
                <div class="mb-3">
                    <label for="old_password" class="form-label fw-semibold">Current Password</label>
                    <input type="password" class="form-control py-2" id="old_password" name="old_password" required placeholder="Enter current password">
                </div>
                
                <div class="mb-3">
                    <label for="new_password" class="form-label fw-semibold">New Password</label>
                    <input type="password" class="form-control py-2" id="new_password" name="new_password" required placeholder="Choose new password">
                </div>
                
                <div class="mb-4">
                    <label for="confirm_new_password" class="form-label fw-semibold">Confirm New Password</label>
                    <input type="password" class="form-control py-2" id="confirm_new_password" name="confirm_new_password" required placeholder="Confirm new password">
                </div>
                
                <button type="submit" class="btn btn-primary-custom w-100 py-2"><i class="fas fa-lock me-2"></i>Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
